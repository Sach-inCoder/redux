name: "First Workflow"
on: 
  push:
  pull_request:
    branches:
      - main
      - dev
      - qa
jobs:
  first-job:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: "Set up node in VM"
        uses: actions/setup-node@v4
        with:
          node-version: 24
          chech: npm
      
      - name: install dependency
        run: npm ci
      
      - name: make react build
        run: npm run build